<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TON Sentinel dashboard</title>
  <link rel="stylesheet" href="/dashboard/assets/app.css">
  <script type="module" src="/dashboard/assets/app.js"></script>
</head>
<body data-state="loading">
  <header class="site-header">
    <h1 class="brand">TON Sentinel</h1>
    <nav id="main-nav" class="nav" aria-label="Views"></nav>
    <label class="network">Network
      <select id="network-select">
        <option value="mainnet">mainnet</option>
        <option value="testnet">testnet</option>
      </select>
    </label>
  </header>
  <div id="honesty-banner" class="banner" role="note">
    <strong>Read this first.</strong>
    <span id="honesty-banner-text">Loading the server honesty statement. Nothing is shown until it arrives.</span>
  </div>
  <div id="provenance-bar" class="provenance" hidden></div>
  <div id="blocking-state" class="blocking" role="alert" hidden>
    <h2>Dashboard blocked</h2>
    <p id="blocking-reason"></p>
  </div>
  <noscript><p class="blocking">This dashboard needs JavaScript. No data is shown without it.</p></noscript>
  <main id="view-root" class="view" hidden></main>
</body>
</html>
