global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels: {env: local}
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
rule_files: [/etc/prometheus/rules/*.yml]
scrape_configs:
  - job_name: ton-sentinel-api
    metrics_path: /metrics
    honor_labels: false
    static_configs:
      - targets: ['api:8080']
