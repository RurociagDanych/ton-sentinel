# Local monitoring: Prometheus + Grafana. Loopback only. Run monitoring/init-secrets.sh first.
# Digests resolved with `docker buildx imagetools inspect` on 2026-11-16 (index digests):
#   prom/prometheus:v3.5.0  grafana/grafana:12.2.0  prom/alertmanager:v0.28.1  python:3.12-slim
services:
  prometheus:
    image: prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
      - --storage.tsdb.wal-compression
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - promdata:/prometheus
    ports: ['127.0.0.1:9090:9090']
    networks: [fixture, edge]
    depends_on: [api, alertmanager]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.25
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
  alertmanager:
    image: prom/alertmanager@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ['127.0.0.1:9093:9093']
    networks: [fixture, edge]
    depends_on: [alert-sink]
    read_only: true
    tmpfs: ['/alertmanager:uid=65534,gid=65534', /tmp]
    mem_limit: 64m
    cpus: 0.25
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
  alert-sink:
    image: python@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    command: [python, /app/sink.py]
    volumes:
      - ./monitoring/alertmanager/sink.py:/app/sink.py:ro
      - alertsink:/data
    networks: [fixture]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 32m
    cpus: 0.1
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
  grafana:
    image: grafana/grafana@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
    user: '1000:1000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: 'false'
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    secrets: [grafana_admin]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana-dashboards:ro
    tmpfs: ['/var/lib/grafana:uid=1000,gid=1000,mode=0700', /tmp]
    ports: ['127.0.0.1:3000:3000']
    networks: [fixture, edge]
    depends_on: [prometheus]
    read_only: true
    mem_limit: 192m
    cpus: 0.25
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
volumes:
  promdata: {}
  alertsink: {}
secrets:
  grafana_admin:
    file: ../.cache/secrets/grafana_admin
